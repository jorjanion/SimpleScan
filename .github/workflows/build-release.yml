name: Build & Release SimpleScan

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build, Test & Package
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 9
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Install WiX 5 Toolset
      run: dotnet tool install -g wix --version 5.0.2

    - name: Restore dependencies
      run: dotnet restore SimpleScan.sln

    - name: Run automated tests
      run: dotnet test SimpleScan.sln -c Release --no-restore --verbosity normal

    - name: Publish standalone portable executable
      run: >
        dotnet publish src/SimpleScan.UI/SimpleScan.UI.csproj
        -c Release
        -r win-x64
        --self-contained
        -p:PublishSingleFile=true
        -p:IncludeNativeLibrariesForSelfExtract=true
        -o dist/portable

    - name: Package Portable Executable & Zip
      shell: pwsh
      run: |
        Copy-Item dist/portable/SimpleScan.exe dist/portable/SimpleScan-Portable.exe -Force
        Compress-Archive -Path dist/portable/SimpleScan.exe -DestinationPath dist/portable/SimpleScan-Portable.zip -Force

    - name: Build MSI Installer
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Path dist/installer -Force
        wix build installer/Package.wxs -o dist/installer/SimpleScan-Installer.msi

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: SimpleScan-Packages
        path: |
          dist/portable/SimpleScan-Portable.exe
          dist/portable/SimpleScan-Portable.zip
          dist/installer/SimpleScan-Installer.msi

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/installer/SimpleScan-Installer.msi
          dist/portable/SimpleScan-Portable.exe
          dist/portable/SimpleScan-Portable.zip
        draft: false
        prerelease: false
        generate_release_notes: true
